<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Oloolua Youth Guardians</title>
  <desc id="desc">A circular forest emblem with a broad tree, rising sun, river, and young guardians.</desc>
